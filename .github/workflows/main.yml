name: CI/CD Pipeline — webapp-devops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    
jobs:

  # ── JOB 1: Pruebas unitarias ──────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List test files
        run: npx jest --listTests

      - name: Run all tests
        run: npx jest --verbose --coverage --coverageThreshold='{"global":{"lines":70}}'

  # ── JOB 2: Build y Push a Docker Hub ─────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

  # ── JOB 3: Deploy en EC2 ─────────────────────────
  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            docker stop webapp-container || true
            docker rm webapp-container || true
            docker run -d --name webapp-container \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest