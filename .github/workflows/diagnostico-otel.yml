name: Diagnostico OpenTelemetry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opentelemetry

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    env:
      OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
      OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}

    steps:
      - name: Comprobar conexion OTLP
        shell: bash
        run: |
          set -eu

          BASE="${OPENOBSERVE_URL%/}"
          BASE="${BASE%/_json}"
          BASE="${BASE%/*}"

          if [[ "$OPENOBSERVE_AUTH" == *:* ]]; then
            echo "Formato de autenticacion: usuario:token"
          else
            echo "Formato de autenticacion: otro"
          fi

          echo "Longitud de credencial: ${#OPENOBSERVE_AUTH}"
          echo "Longitud del endpoint base: ${#BASE}"

          echo "Comprobando trazas"

          curl --fail-with-body -sS \
            --user "$OPENOBSERVE_AUTH" \
            --header "Content-Type: application/json" \
            --data '{"resourceSpans":[]}' \
            --write-out '\nHTTP: %{http_code}\n' \
            "$BASE/v1/traces"

          echo "Comprobando metricas"

          curl --fail-with-body -sS \
            --user "$OPENOBSERVE_AUTH" \
            --header "Content-Type: application/json" \
            --data '{"resourceMetrics":[]}' \
            --write-out '\nHTTP: %{http_code}\n' \
            "$BASE/v1/metrics"